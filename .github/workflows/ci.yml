  #         persist-credentials: false
  #     - name: Set up Node.js
  #       uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
  #       with:
  #         node-version: 24
  #         cache: npm
  #     - name: Install dependencies
  #       run: npm ci
  #     - name: Show the browser
  #       run: google-chrome --version
  #     # Fails (does not skip) when no browser is found, because CI is set.
  #     - name: Check layout in Chromium
  #       run: npm run check:layout
  #
  # webkit:   # the iPhone runs WebKit; a stylesheet Blink tolerates can overflow there
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 20
  #   permissions:
  #     contents: read
  #   steps:
  #     - name: Check out repository
  #       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
